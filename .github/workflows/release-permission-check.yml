name: Release permission check

on:
  workflow_dispatch:

permissions: {}

jobs:
  draft-release:
    name: Draft release lifecycle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create, edit, and remove a draft release at the workflow commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="release-permission-check/$GITHUB_RUN_ID"

          cleanup() {
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            else
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$GITHUB_SHA" \
            --silent
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Release permission check" \
            --notes "Disposable draft release permission check."
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true"

          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Disposable draft release permission check passed."

          cleanup
          trap - EXIT
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Disposable draft release was not removed" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Disposable release tag was not removed" >&2
            exit 1
          fi

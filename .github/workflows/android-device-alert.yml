name: Android device conformance alert

on:
  workflow_run:
    workflows: [Android device conformance]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: expo-turbo-android-device-alert-state
  cancel-in-progress: false

jobs:
  alert:
    name: Reconcile Android device alert
    if: github.repository == 'noscrubs-dev/expo-turbo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALERT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_PATH: ${{ github.event_path }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SERVER_URL: ${{ github.server_url }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Reconcile the deduplicated GitHub issue
        run: bun scripts/ci/android-device-alert.ts

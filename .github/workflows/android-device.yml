name: Android device conformance

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Optional trusted branch, tag, or SHA to test with this main-owned workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: expo-turbo-android-device
  cancel-in-progress: false

jobs:
  maestro:
    name: Shared Maestro suite
    if: >-
      github.repository == 'noscrubs-dev/expo-turbo' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on:
      - self-hosted
      - linux
      - x64
      - expo-turbo-android-trusted
    timeout-minutes: 90
    env:
      EXPO_TURBO_CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.EXPO_TURBO_CHECKOUT_REF }}
          persist-credentials: false
      - name: Run the shared suite on Android
        shell: bash
        run: exec scripts/ci/run-android-maestro-entry.sh
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-device-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/android-device
          # Maestro output must stay outside hidden paths. Keep this false so
          # the evidence upload cannot begin to include unrelated hidden data.
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14

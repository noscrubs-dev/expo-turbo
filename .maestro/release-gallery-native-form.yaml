    timeout: 5000
- extendedWaitUntil:
    visible:
      id: demo-form-focus-probe-id-first-name
      text: "Focus probe: focused; revision 3"
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
          focused: true
- assertVisible: First name is required
- assertNotVisible: Confirm form submission

appId: dev.noscrubs.expoturbo.example
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Expo Turbo
    timeout: 120000
- openLink: "expoturboexample://device-test-gallery?scenario=form"
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Live native form controls
    timeout: 30000
- assertVisible: Form ready
# Android BACK is only safe when the soft keyboard is genuinely up: Maestro sends
# `input keyevent 4` unconditionally for both pressKey: BACK and hideKeyboard, so
# with the keyboard already down the same key left the app and every later step
# reported a missing element instead of the navigation that caused it. This block
# establishes that precondition instead of assuming it. Sampled on this AVD with
# dumpsys immediately before the key event: left to the initial document
# autofocus the keyboard was up in 6 of 10 trials, and in all 4 trials where it
# was down, BACK reached the launcher. After the two taps below it was up 8/8.
# See issue #408.
#
# First tap: a non-interactive element, which puts the keyboard down whatever
# autofocus did, so the field below is never hidden behind it.
# Second tap: the field itself, so the keyboard is up and the untargeted
# eraseText acts on a known control rather than on whatever happened to be
# focused.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Live native form controls
      - assertVisible: Form ready
      - tapOn:
          id: demo-form-input-id-first-name
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: BACK
      # Here for the diagnostic rather than the speed: if BACK ever does leave
      # the app this fails naming Form ready, which this screen genuinely owns,
      # instead of blaming the submitter further down. It is also
      # somewhat faster. Forcing an app exit at this point, it failed in 26.4s
      # where the old submitter path took 40.9s; both figures were measured
      # during review of PR #424, not by the pass-rate arms.
      - assertVisible: Form ready
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: demo-form-submitter-id-collect-form
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- tapOn:
    id: demo-form-submitter-id-collect-form
- scrollUntilVisible:
    element:
      id: demo-form-input-id-first-name
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
      - assertVisible: First name is required
- inputText: Ada
- runFlow:
    when:
      platform: Android
    commands:
      # Safe for the same reason: the assertion above establishes that this
      # field holds focus, and inputText types into it. This site was not
      # sampled with dumpsys the way the first one was; the support for it is
      # that no run in the 20-run arm failed after this point.
      - pressKey: BACK
      - assertVisible: Form ready
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: demo-form-submitter-id-collect-form
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- tapOn:
    id: demo-form-submitter-id-collect-form
- assertVisible: Confirm form submission
- assertVisible: Send this immutable preview?
- tapOn:
    text: Continue
    waitToSettleTimeoutMs: 100
- assertVisible: Submission loading state observed
- extendedWaitUntil:
    visible: Form submission failed. Check the form and retry.
    timeout: 30000
- assertVisible:
    id: demo-form-input-id-first-name
    text: Ada
- assertVisible:
    id: demo-form-input-id-city
    text: London
- assertVisible:
    id: demo-form-input-id-legend-note
    text: Still included
- tapOn: Retry from current values
- assertVisible: Confirm form submission
- tapOn:
    text: Continue
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: Form submission complete. Nothing changed.
    timeout: 30000
- assertVisible: Dismiss result
- tapOn: Dismiss result
- assertVisible: Form ready

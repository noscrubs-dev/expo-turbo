appId: dev.noscrubs.expoturbo.example
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Expo Turbo
    timeout: 120000
- openLink: "expoturboexample://device-test-gallery?scenario=form"
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Live native form controls
    timeout: 30000
- extendedWaitUntil:
    visible: Form ready
    timeout: 5000
# The shared oracle is the real React Native TextInput event stream. Maestro's
# retained iOS hierarchy does not report its focused property reliably, so iOS
# and Android both use this probe. Android keeps its native selector as a second
# check.
- tapOn:
    id: demo-form-input-id-first-name
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: demo-form-focus-probe-id-first-name
      text: "Focus probe: focused; revision 1"
    timeout: 5000
- eraseText
# Invalid submission focus cycle 1 of 9.
- scrollUntilVisible:
    element:
      text: Live native form controls
    direction: UP
    timeout: 5000
    visibilityPercentage: 20
- tapOn:
    text: Live native form controls
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: demo-form-focus-probe-id-first-name
      text: "Focus probe: blurred; revision 2"
    timeout: 5000
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
          focused: false
- extendedWaitUntil:
    visible: Form ready
    timeout: 5000
- assertNotVisible: Confirm form submission
- assertNotVisible: Send this immutable preview?
- assertNotVisible: Submission loading state observed
- assertNotVisible: Form submission failed. Check the form and retry.
- assertNotVisible: Form submission complete. Nothing changed.
- scrollUntilVisible:
    element:
      id: demo-form-submitter-id-collect-form
    direction: DOWN
    timeout: 5000
    visibilityPercentage: 20
- extendedWaitUntil:
    visible:
      id: demo-form-submitter-id-collect-form
    timeout: 5000
- tapOn:

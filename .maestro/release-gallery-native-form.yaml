appId: dev.noscrubs.expoturbo.example
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Expo Turbo
    timeout: 120000
- openLink: "expoturboexample://device-test-gallery?scenario=form"
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Live native form controls
    timeout: 30000
- assertVisible: Form ready
- eraseText
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: BACK
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: demo-form-submitter-id-collect-form
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- tapOn:
    id: demo-form-submitter-id-collect-form
- scrollUntilVisible:
    element:
      id: demo-form-input-id-first-name
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
          focused: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: demo-form-input-id-first-name
      - assertVisible: First name is required
- inputText: Ada
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: BACK
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: demo-form-submitter-id-collect-form
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 20
- tapOn:
    id: demo-form-submitter-id-collect-form
- assertVisible: Confirm form submission
- assertVisible: Send this immutable preview?
- tapOn:
    text: Continue
    waitToSettleTimeoutMs: 100
- assertVisible: Submission loading state observed
- extendedWaitUntil:
    visible: Form submission failed. Check the form and retry.
    timeout: 30000
- assertVisible:
    id: demo-form-input-id-first-name
    text: Ada
- assertVisible:
    id: demo-form-input-id-city
    text: London
- assertVisible:
    id: demo-form-input-id-legend-note
    text: Still included
- tapOn: Retry from current values
- assertVisible: Confirm form submission
- tapOn:
    text: Continue
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: Form submission complete. Nothing changed.
    timeout: 30000
- assertVisible: Dismiss result
- tapOn: Dismiss result
- assertVisible: Form ready

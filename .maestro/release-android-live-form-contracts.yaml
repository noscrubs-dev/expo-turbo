appId: dev.noscrubs.expoturbo.example
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Expo Turbo
    timeout: 120000
- openLink: expoturboexample://live-frame-form
- extendedWaitUntil:
    visible:
      id: demo-form-input-id-demo-form-first-name
    timeout: 120000
- assertVisible: Rails Frame form
- tapOn:
    id: demo-form-input-id-demo-form-first-name
- inputText: invalid-local-draft
- hideKeyboard
- tapOn: Save name and preserve local draft
- extendedWaitUntil:
    visible: This demo name is unavailable
    timeout: 30000
- assertVisible:
    id: demo-form-input-id-demo-form-first-name
    text: invalid-local-draft
- tapOn: Complete without replacing Frame
- extendedWaitUntil:
    visible: This demo name is unavailable
    timeout: 30000
- assertVisible:
    id: demo-form-input-id-demo-form-first-name
    text: invalid-local-draft
- tapOn:
    id: demo-form-input-id-demo-form-first-name
- eraseText
- inputText: Ada
- hideKeyboard
- tapOn: Save first name as text/plain
- extendedWaitUntil:
    notVisible: This demo name is unavailable
    timeout: 30000
- assertVisible: Rails Frame form
